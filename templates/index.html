<!-- Home Page html-->
<!DOCTYPE html>
<html>
<head>
    <title>Sports Predictor Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🏀 Sports Predictor Dashboard</h1>

    <div class="teams-section">
        <h2>NBA Teams</h2>

        <ul class="team-list">
            {% for team in teams %}
                <li>
                    <a href="/team/{{ team[0] }}">
                        {{ team[1] }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>

    <hr>

    <h2>📊 Analytics Dashboard</h2>

    <div class="dashboard">

        <div class="analytics-card" id="homeAway">
            Loading Home/Away Statistics...
        </div>

        <div class="analytics-card" id="eastWest">
            Loading Conference Statistics...
        </div>

        <div class="analytics-card" id="rankings">
            Loading Team Rankings...
        </div>

        <div class="analytics-card" id="differential">
            Loading Point Differentials...
        </div>

    </div>

</div>

<script>
async function loadAnalytics() {

    const homeAway = await fetch("/api/home-away").then(r => r.json());

    document.getElementById("homeAway").innerHTML =
        `<h3>🏠 Home vs Away Performance</h3>
         <p><strong>Home Win %:</strong> ${homeAway.home_win_pct}%</p>
         <p><strong>Away Win %:</strong> ${homeAway.away_win_pct}%</p>`;

    const eastWest = await fetch("/api/east-west").then(r => r.json());

    document.getElementById("eastWest").innerHTML =
        `<h3>🏀 East vs West Performance</h3>
         <p><strong>East Win %:</strong> ${eastWest.east_win_pct}%</p>
         <p><strong>West Win %:</strong> ${eastWest.west_win_pct}%</p>`;

    const rankings = await fetch("/api/rankings").then(r => r.json());

    let rankingHTML = "<h3>🏆 Top Teams by Win Percentage</h3><ol>";

    rankings.slice(0, 10).forEach(t => {
        rankingHTML += `<li>${t.team} - ${t.win_pct}%</li>`;
    });

    rankingHTML += "</ol>";

    document.getElementById("rankings").innerHTML = rankingHTML;

    const diff = await fetch("/api/differential").then(r => r.json());

    let diffHTML = "<h3>📈 Average Point Differential</h3><ol>";

    diff.slice(0, 10).forEach(t => {
        diffHTML += `<li>${t.team} - ${t.avg_diff}</li>`;
    });

    diffHTML += "</ol>";

    document.getElementById("differential").innerHTML = diffHTML;
}

loadAnalytics();
</script>

</body>
</html>
