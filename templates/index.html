<!-- Home Page html-->
<!DOCTYPE html>
<html>
<head>
    <title>Sports Predictor Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

</head>

<body>

<div class="container">

    <h1>🏀 Sports Predictor Dashboard</h1>

    <div class="teams-section">
        <h2>NBA Teams</h2>

        <ul class="team-list">
            {% for team in teams %}
                <li>
                    <a href="/team/{{ team[0] }}">
                        {{ team[1] }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>

    <hr>

    <h2>📊 Analytics Dashboard</h2>

    <div class="dashboard">

        <div class="analytics-card" id="homeAway">
            Loading Home/Away Statistics...
        </div>

        <div class="analytics-card" id="eastWest">
            Loading Conference Statistics...
        </div>

        <div class="analytics-card" id="rankings">
            Loading Team Rankings...
        </div>

        <div class="analytics-card" id="differential">
            Loading Point Differentials...
        </div>

        <div class="analytics-card">

            <h3>🌐 Team Influence Network</h3>

            <div id="pagerankGraph"></div>

        </div>

        <div class="analytics-card">

            <h3>📊 Team Clusters</h3>

            <div id="kmeansChart"></div>

        </div>

    </div>

</div>

<script>
async function loadAnalytics() {

    const homeAway = await fetch("/api/home-away").then(r => r.json());

    document.getElementById("homeAway").innerHTML =
        `<h3>🏠 Home vs Away Performance</h3>
         <p><strong>Home Win %:</strong> ${homeAway.home_win_pct}%</p>
         <p><strong>Away Win %:</strong> ${homeAway.away_win_pct}%</p>`;

    const eastWest = await fetch("/api/east-west").then(r => r.json());

    document.getElementById("eastWest").innerHTML =
        `<h3>🏀 East vs West Performance</h3>
         <p><strong>East Win %:</strong> ${eastWest.east_win_pct}%</p>
         <p><strong>West Win %:</strong> ${eastWest.west_win_pct}%</p>`;

    const rankings = await fetch("/api/rankings").then(r => r.json());

    let rankingHTML = "<h3>🏆 Top Teams by Win Percentage</h3><ol>";

    rankings.slice(0, 10).forEach(t => {
        rankingHTML += `<li>${t.team} - ${t.win_pct}%</li>`;
    });

    rankingHTML += "</ol>";

    document.getElementById("rankings").innerHTML = rankingHTML;

    const diff = await fetch("/api/differential").then(r => r.json());

    let diffHTML = "<h3>📈 Average Point Differential</h3><ol>";

    diff.slice(0, 10).forEach(t => {
        diffHTML += `<li>${t.team} - ${t.avg_diff}</li>`;
    });

    diffHTML += "</ol>";

    document.getElementById("differential").innerHTML = diffHTML;
}

loadAnalytics();
</script>

<script>

async function loadKMeans(){

    const data = await fetch("/api/kmeans")
        .then(r => r.json());


    let clusters = {};


    data.forEach(team => {

        if(!clusters[team.cluster]){

            clusters[team.cluster] = {
                x: [],
                y: [],
                text: [],
                hover: []
            };

        }


        clusters[team.cluster].x.push(team.x);

        clusters[team.cluster].y.push(team.y);

        clusters[team.cluster].text.push(team.team);


        clusters[team.cluster].hover.push(
            `
            <b>${team.team}</b><br>
            Cluster: ${team.cluster}<br>
            <br>
            Win %: ${(team.win_pct * 100).toFixed(1)}%<br>
            Elo: ${team.elo_rating.toFixed(0)}<br>
            Recent Form: ${(team.recent_form * 100).toFixed(0)}%<br>
            Avg Point Diff: +${team.avg_point_diff.toFixed(2)}
            `
        );

    });



    let traces = [];


    for(let cluster in clusters){

        traces.push({

            x: clusters[cluster].x,

            y: clusters[cluster].y,

            text: clusters[cluster].text,

            customdata: clusters[cluster].hover,

            mode: "markers",

            type: "scatter",

            name: "Cluster " + cluster,


            hovertemplate:
                "%{customdata}" +
                "<extra></extra>"

        });

    }



    Plotly.newPlot(
        "kmeansChart",
        traces,
        {
            title:"NBA Team Clusters (PCA)",

            xaxis:{
                title:"Principal Component 1"
            },

            yaxis:{
                title:"Principal Component 2"
            }
        }
    );

}


loadKMeans();

async function loadPageRankGraph(){

    const data = await fetch("/api/pagerank-graph")
        .then(r => r.json());


    let teams = data.nodes.sort(
        (a,b) => b.score - a.score
    );


    // Top 10 only
    teams = teams.slice(0,10);


    let trace = {

        x: teams.map(t => t.team),

        y: teams.map(t => t.score),


        type:"bar",


        hovertemplate:
            "<b>%{x}</b><br>" +
            "PageRank: %{y:.4f}" +
            "<extra></extra>"
    };


    Plotly.newPlot(
        "pagerankGraph",
        [trace],
        {

            title:"🌐 Top 10 Team Influence (PageRank)",


            xaxis:{
                title:"Team",
                tickangle:-45
            },


            yaxis:{
                title:"Influence Score"
            },


            height:500,

            margin:{
                b:150
            }

        }
    );

}


loadPageRankGraph();

</script>

</body>
</html>
