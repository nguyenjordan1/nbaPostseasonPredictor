<!DOCTYPE html>
<html>
<head>
    <title>{{ team }} - Team Page</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🏀 {{ team }}</h1>

    <a href="/">← Back to Dashboard</a>

    <hr>

    <h2>📊 Game History</h2>

    <div class="analytics-card">
        <table class="team-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Opponent</th>
                    <th>Score</th>
                    <th>Location</th>
                </tr>
            </thead>

            <tbody>
                {% for game in games %}
                <tr>
                    <td>{{ game[3] }}</td>
                    <td>{{ game[2] }}</td>
                    <td>{{ game[4] }}</td>
                    <td>{{ game[5] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
